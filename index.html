<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>

<body>

  <header class="site-header">
    <!-- Titolo dell'app + form di ricerca -->
    <h1>SportsHub</h1>
    <p class="subtitle">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

    <form id="search-form" class="search-form">
      <input type="text" id="search-input" placeholder="Cerca una squadra..." required>
      <button type="submit">Cerca</button>
    </form>
  </header>

  <main class="container">

    <section id="risultati-section">
      <!-- Spinner di caricamento (nascosto di default) -->
      <div id="spinner" class="spinner-container d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Caricamento...</span>
        </div>
      </div>

      <!-- Messaggio di errore (nascosto) -->
      <div id="errore" class="alert alert-danger" hidden></div>

      <!-- Squadre preferite -->
      <div class="sezione-header">
        <h2>⭐ Le tue squadre preferite</h2>
      </div>
      <ul id="preferiti-lista" class="lista-squadre">
        <p class="testo-vuoto">Non hai ancora salvato nessuna squadra. Cercane una qui sopra e aggiungila ai preferiti.
        </p>
      </ul>

      <!-- Squadre trovate -->
      <div class="sezione-header mt-4">
        <h2>Squadre trovate</h2>
      </div>
      <ul id="risultati-lista" class="lista-squadre">
        <p class="testo-vuoto">Nessuna squadra trovata.</p>
      </ul>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
